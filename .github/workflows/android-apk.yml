name: Build PUASH Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Android platform
        run: npx cap add android

      - name: Add PUASH branded Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/puash_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#173c31" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00000000" android:strokeColor="#fffaf0"
                  android:strokeWidth="5" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M27,43h54l-5,39q-1,5 -6,5h-32q-5,0 -6,-5z M27,43l7,-14h40l7,14 M43,56q0,10 11,10t11,-10"/>
              <path android:fillColor="#d9b58e" android:pathData="M16,34h8v4h-8z M84,25h8v4h-8z M13,44h7v4h-7z"/>
          </vector>
          EOF
          sed -i 's#@mipmap/ic_launcher_round#@drawable/puash_launcher#g; s#@mipmap/ic_launcher#@drawable/puash_launcher#g' android/app/src/main/AndroidManifest.xml

      - name: Add Firebase Android configuration
        run: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          test -s android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload PUASH APK
        uses: actions/upload-artifact@v4
        with:
          name: PUASH-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
